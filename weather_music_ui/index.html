<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Music</title>
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="style.css">
</head>
<!-- 🌟 id="app-body" とアニメーション(transition)を追加 -->
<body id="app-body" class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center p-4 font-sans text-gray-800 transition-colors duration-1000">

  <div class="bg-white/80 backdrop-blur-md rounded-3xl shadow-xl p-8 max-w-sm w-full text-center border border-white">
    
    <h1 class="text-2xl font-bold text-indigo-900 mb-2">Weather Music 🎵</h1>
    <p id="status-text" class="text-sm text-gray-500 mb-6">地図をクリック、または現在地を取得</p>

    <!-- 🌟 地図の表示エリアを追加 -->
    <div id="map" class="h-32 w-full rounded-xl mb-6 shadow-inner z-0"></div>

    <div class="flex justify-center gap-6 mb-6">
      <div class="bg-indigo-50/80 rounded-2xl p-4 w-24 shadow-inner">
        <p class="text-xs text-indigo-400 font-semibold mb-1">TEMP</p>
        <p id="temp" class="text-2xl font-bold text-indigo-700">--<span class="text-sm">°C</span></p>
      </div>
      <div class="bg-indigo-50/80 rounded-2xl p-4 w-24 shadow-inner">
        <p class="text-xs text-indigo-400 font-semibold mb-1">HUMIDITY</p>
        <p id="humidity" class="text-2xl font-bold text-indigo-700">--<span class="text-sm">%</span></p>
      </div>
    </div>

    <div class="mb-8 p-5 bg-white/60 rounded-2xl shadow-sm border border-white/80">
      <div class="mb-4 text-left">
        <p class="text-[10px] text-indigo-400 font-bold tracking-wider mb-1">NOW PLAYING</p>
        <!-- 🌟 曲名と都市名のidを追加 -->
        <p id="song-title" class="text-gray-800 font-bold truncate">🌤️ 晴れ間のピアノ・アンビエント</p>
        <p id="city-name" class="text-xs text-gray-500 mt-1">Generated by Tokyo Weather</p>
      </div>
      
      <!-- プログレスバー等は省略せずにそのまま残してください -->
      <div class="mb-4">
        <div class="w-full h-1.5 bg-indigo-100 rounded-full overflow-hidden">
          <div class="h-full bg-indigo-500 w-1/3 rounded-full relative"></div>
        </div>
      </div>
    </div>

    <!-- 🌟 idをJavaScriptと一致させる -->
    <button id="getWeatherButton" class="w-full bg-white hover:bg-indigo-50 text-indigo-600 border border-indigo-100 font-bold py-3 px-4 rounded-xl shadow-sm hover:shadow transition-all duration-200 flex items-center justify-center gap-2">
      <span class="text-xl">📍</span> 
      現在地から天気を取得
    </button>
  </div>

  <!-- 🌟 スクリプトの読み込み順序が重要です -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="config.js"></script>
  <script src="ui.js"></script>
  <script src="script.js"></script>
</body>
</html>
